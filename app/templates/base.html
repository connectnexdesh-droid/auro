<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>{{ page_title|default("AURO") }} · AURO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/">
        <span class="brand-mark">A</span>
        <span class="brand-copy">
          <strong>AURO</strong>
          <small>Browser automation</small>
        </span>
      </a>

      <div class="sidebar-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
          <span class="nav-icon">▦</span> Dashboard
        </a>
        <a class="nav-link {% if request.url.path.startswith('/settings') %}active{% endif %}" href="/settings">
          <span class="nav-icon">⚙</span> Settings
        </a>
      </nav>

      <div class="sidebar-bottom">
        <span class="connection-dot"></span>
        <span>Local workspace</span>
        <span class="sidebar-version">v0.1.0</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>AURO</span><span class="breadcrumb-separator">/</span><strong>{{ page_title|default("Workspace") }}</strong></div>
        <div class="topbar-right">
          <span class="environment-label"><span class="connection-dot"></span> SELF-HOSTED</span>
          <a class="avatar" href="/settings" aria-label="Open settings">AU</a>
        </div>
      </header>

      <div class="page-content">
        <div id="flash-message" class="flash-message" role="status" aria-live="polite" hidden></div>
        {% block content %}{% endblock %}
        <footer class="page-footer">
          <span>AURO · Personal browser automation workspace</span>
          <span>Runs locally in your environment</span>
        </footer>
      </div>
    </main>
  </div>
</body>
</html>
