name: AURO CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# GitHub Actions only needs read access to check out this repository.
permissions:
  contents: read

# Cancel an older run for the same branch when a newer commit arrives.
concurrency:
  group: auro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and Chrome smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The runner launches channel="chrome", so install branded Chrome.
      # --with-deps also installs the Linux libraries needed by the browser.
      - name: Install Google Chrome for Playwright
        run: python -m playwright install --with-deps chrome

      - name: Verify Python source syntax
        run: python -m compileall -q app tests

      - name: Run pytest suite
        run: python -m pytest -v tests/

      # Exercise the real public demo form and leave its screenshot for upload.
      - name: Run browser automation smoke test
        run: |
          mkdir -p screenshots
          python -m app.runner app/tasks/demo_form.yaml --headless

      - name: Run dashboard browser UI smoke test
        run: python tests/dashboard_browser_smoke.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auro-screenshots-run-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Docker image and Compose validation
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build AURO Docker image
        run: docker build --pull --tag auro-panel:ci .
