name: AURO Windows Desktop

on:
  push:
    branches:
      - main
      - feature/auro-windows-desktop
    paths:
      - "app/**"
      - "desktop/**"
      - "requirements*.txt"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "desktop/**"
      - "requirements*.txt"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auro-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Generate AURO application icon
        run: python desktop/create_icon.py

      - name: Run Python tests and compile checks
        run: |
          python -m compileall -q app desktop tests
          python -m pytest -q tests/ -k "not demo_form_runs_headless_and_produces_screenshot"

      - name: Install bundled Playwright Chromium
        shell: pwsh
        run: |
          $browserPath = Join-Path $env:GITHUB_WORKSPACE ".playwright-browsers"
          New-Item -ItemType Directory -Force -Path $browserPath | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserPath
          $env:AURO_BUILD_BROWSERS_PATH = $browserPath
          "PLAYWRIGHT_BROWSERS_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AURO_BUILD_BROWSERS_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m playwright install chromium

      - name: Build AURO Windows application
        run: pyinstaller --noconfirm --clean desktop/AURO.spec

      - name: Smoke-test the packaged executable and bundled browser
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AURO\AURO.exe")) {
            throw "PyInstaller did not produce dist\AURO\AURO.exe"
          }
          & "dist\AURO\AURO.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged AURO smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\AURO" -DestinationPath "dist\AURO-Portable.zip" -CompressionLevel NoCompression -Force

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "desktop\installer.iss" "/DAppVersion=0.1.0"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify deliverables
        shell: pwsh
        run: |
          $installer = "dist\AURO-Setup-0.1.0.exe"
          $portable = "dist\AURO-Portable.zip"
          foreach ($file in @($installer, $portable)) {
            if (-not (Test-Path $file)) {
              throw "Expected desktop deliverable was not created: $file"
            }
            if ((Get-Item $file).Length -lt 1MB) {
              throw "Desktop deliverable is unexpectedly small: $file"
            }
          }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload Windows desktop deliverables
        uses: actions/upload-artifact@v4
        with:
          name: auro-windows-desktop-${{ github.run_number }}
          path: |
            dist/AURO-Setup-0.1.0.exe
            dist/AURO-Portable.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
